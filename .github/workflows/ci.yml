name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Stub values so Next.js can resolve env vars at build time.
      # Real secrets are never needed for lint/typecheck/test/build.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      INNGEST_EVENT_KEY: ci-event-key
      INNGEST_SIGNING_KEY: ci-signing-key
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --passWithNoTests

      - name: Build
        run: npm run build
