name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'worker/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: flyctl deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy worker to Fly.io
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app chess-improver-worker \
            --config worker/fly.toml \
            --dockerfile worker/Dockerfile \
            --remote-only

      - name: Comment on commit if deploy failed
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              ':rotating_light: **Worker auto-deploy failed**',
              '',
              `The \`deploy-worker\` workflow failed for commit ${context.sha.slice(0, 7)}.`,
              `The Fly.io worker (\`chess-improver-worker\`) may be running stale code.`,
              '',
              `Run logs: ${runUrl}`,
              '',
              'Retry by re-running the workflow, or deploy manually:',
              '```',
              'flyctl deploy --config worker/fly.toml --dockerfile worker/Dockerfile',
              '```',
            ].join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });
